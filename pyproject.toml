[project]
name = "com-seiraiharaguchi-mediawidgets"
version = "1.0.0"
description = "一个用于显示 Windows SMTC 媒体信息的 Class Widgets 插件。"
authors = [
    {name = "Seirai Haraguchi"},
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "class-widgets-sdk",
    "winrt-runtime~=3.2.1.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation~=3.2.1.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections~=3.2.1.0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams~=3.2.1.0; sys_platform == 'win32'",
    "winrt-Windows.Media~=3.2.1.0; sys_platform == 'win32'",
    "winrt-Windows.Media.Control~=3.2.1.0; sys_platform == 'win32'",
]

[tool.setuptools]
packages = []

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
