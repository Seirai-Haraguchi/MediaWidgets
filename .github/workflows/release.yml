name: Release Plugin

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  test-linux:
    # Linux 支持验证：插件含 MPRIS 后端（PySide6.QtDBus），需在真实 Linux + PySide6 下跑逻辑测试
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install PySide6-Essentials loguru

      - name: Syntax check all plugin modules
        run: |
          python -m py_compile main.py media_backend.py smtc_backend.py mpris_backend.py netease_lyrics.py lyrics_pusher.py plugin_config.py

      - name: Run MPRIS backend logic tests
        run: |
          python _test_mpris.py

  release:
    # 必须用 Windows：winrt 依赖带 sys_platform == 'win32' 标记，
    # Linux 上 pip 会跳过它们，打出的包在用户机器上无法初始化 SMTC 后端
    runs-on: windows-latest
    # SDK 打包器输出含中文，en-US runner 的 cp1252 管道无法编码会直接崩溃，
    # 强制 Python 使用 UTF-8（click 8.5 起 echo 不再有编码回退保护）
    env:
      PYTHONUTF8: "1"
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          profile: minimal
          override: true
      
      - name: Install git-cliff
        run: |
          cargo install git-cliff
      
      - name: Install dependencies
        run: |
          pip install -e .
      
      - name: Build plugin packages
        run: |
          # Build .cwplugin format
          cw-plugin-pack
          # Build .zip format
          cw-plugin-pack --format zip
      
      - name: Publish to plugin registry
        env:
          CWPT_TOKEN: ${{ secrets.CWPT_TOKEN }}
        run: |
          cw-plugin-publish
      
      - name: Get version from tag
        id: get_version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Generate changelog with git-cliff
        id: generate_changelog
        shell: bash
        run: |
          git-cliff --config .git-cliff.toml --tag v${{ env.VERSION }} > CHANGELOG.md
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          cat CHANGELOG.md >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
      
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ env.VERSION }}
          draft: false
          prerelease: false
          files: |
            *.cwplugin
            *.zip
          body: ${{ env.CHANGELOG }}
          generate_release_notes: false
